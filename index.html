<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雪隧車速即時判斷</title>
  <!-- PWA 設定 -->
  <link rel="manifest" href="data:application/json;base64,ewogICJuYW1lIjogIuocsXmqpTo9k6TllLTooI4iLAogICJzaG9ydF9uYW1lIjogIuocsXmqpTo9IiwKICAic3RhcnRfdXJsIjogIi4vaW5kZXguaHRtbCIsCiAgImRpc3BsYXkiOiAic3RhbmRhbG9uZSIsCiAgImJhY2tncm91bmRfY29sb3IiOiAiIzEyMTIxMiIsCiAgInRoZW1lX2NvbG9yIjogIiMxMjEyMTIiCn0=">
  <meta name="theme-color" content="#121212">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-4 flex flex-col items-center justify-between">

  <div class="w-full max-w-md space-y-4">
    <!-- 頁首 -->
    <header class="flex justify-between items-center py-2 border-b border-gray-800">
      <div>
        <h1 class="text-xl font-bold tracking-wide text-gray-100">雪隧車速即時判斷</h1>
        <p class="text-xs text-gray-400">國道 5 號 · 15.2K - 28.3K</p>
      </div>
      <button onclick="fetchData()" class="p-2 bg-gray-800 rounded-full hover:bg-gray-700 active:scale-95 transition">
        🔄
      </button>
    </header>

    <!-- 方向切換 -->
    <div class="flex bg-gray-800 p-1 rounded-xl">
      <button id="btn-north" onclick="setDirection('north')" class="flex-1 py-2 text-center rounded-lg bg-amber-500 font-bold text-sm text-gray-950 transition">往台北 (北上)</button>
      <button id="btn-south" onclick="setDirection('south')" class="flex-1 py-2 text-center rounded-lg text-gray-400 font-bold text-sm hover:text-white transition">往宜蘭 (南下)</button>
    </div>

    <!-- 狀態標籤 -->
    <div id="status-tag" class="text-xs text-gray-400 flex items-center gap-1">
      <span class="w-2 h-2 rounded-full bg-yellow-500 inline-block animate-pulse"></span>
      <span id="status-text">正在載入即時車速...</span>
    </div>

    <!-- 車速顯示卡片 -->
    <div class="grid grid-cols-2 gap-3">
      <!-- 內側 -->
      <div class="bg-gray-800/80 border border-gray-700/50 p-4 rounded-2xl flex flex-col items-center">
        <span class="text-xs text-gray-400 mb-1">↑ 內側車道</span>
        <div class="my-2">
          <span id="speed-inner" class="text-4xl font-black text-amber-400">--</span>
          <span class="text-xs text-gray-500">KM/H</span>
        </div>
        <span id="count-inner" class="text-[10px] text-gray-500">車道 1 · 偵測站 0</span>
      </div>

      <!-- 外側 -->
      <div class="bg-gray-800/80 border border-gray-700/50 p-4 rounded-2xl flex flex-col items-center">
        <span class="text-xs text-gray-400 mb-1">↑ 外側車道</span>
        <div class="my-2">
          <span id="speed-outer" class="text-4xl font-black text-amber-400">--</span>
          <span class="text-xs text-gray-500">KM/H</span>
        </div>
        <span id="count-outer" class="text-[10px] text-gray-500">車道 2 · 偵測站 0</span>
      </div>
    </div>

    <!-- 建議區塊 -->
    <div class="bg-gray-800/50 border border-gray-700/30 p-4 rounded-2xl">
      <div id="recommend-title" class="text-sm font-bold text-gray-200">請稍候</div>
      <div id="recommend-desc" class="text-xs text-gray-400 mt-1">正在連線至交通部 TDX 取得即時資料...</div>
    </div>
  </div>

  <footer class="w-full max-w-md text-center py-4 text-[10px] text-gray-600 flex justify-between">
    <span>資料來源：TDX 運輸資料流通服務</span>
    <span id="update-time">最後更新 --:--:--</span>
  </footer>

  <script>
    // 金鑰設定
    const CLIENT_ID = 'qwpto.tw-88d942c1-3492-47ad';
    const CLIENT_SECRET = '1d840dec-7d95-4928-8060-4599b8724c41';

    let currentDir = 'north'; // 'north' 或 'south'

    function setDirection(dir) {
      currentDir = dir;
      const btnN = document.getElementById('btn-north');
      const btnS = document.getElementById('btn-south');
      if (dir === 'north') {
        btnN.className = 'flex-1 py-2 text-center rounded-lg bg-amber-500 font-bold text-sm text-gray-950 transition';
        btnS.className = 'flex-1 py-2 text-center rounded-lg text-gray-400 font-bold text-sm hover:text-white transition';
      } else {
        btnS.className = 'flex-1 py-2 text-center rounded-lg bg-amber-500 font-bold text-sm text-gray-950 transition';
        btnN.className = 'flex-1 py-2 text-center rounded-lg text-gray-400 font-bold text-sm hover:text-white transition';
      }
      fetchData();
    }

    // 取得 Access Token
    async function getAccessToken() {
      const tokenUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token');
      const params = new URLSearchParams();
      params.append('grant_type', 'client_credentials');
      params.append('client_id', CLIENT_ID);
      params.append('client_secret', CLIENT_SECRET);

      const res = await fetch(tokenUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      if (!res.ok) throw new Error('Token 取得失敗');
      const data = await res.json();
      return data.access_token;
    }

    // 抓取車速資料
    async function fetchData() {
      const statusText = document.getElementById('status-text');
      statusText.innerText = '正在更新數據...';
      
      try {
        const token = await getAccessToken();
        const apiUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://tdx.transportdata.tw/api/basic/v2/Road/Traffic/VD/Live/Freeway?%24filter=RoadID%20eq%20%2700050%27&%24format=JSON');

        const res = await fetch(apiUrl, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!res.ok) throw new Error('API 請求失敗');
        const data = await res.json();

        processVDData(data.VDLives || data);
      } catch (err) {
        console.error(err);
        statusText.innerText = '資料讀取失敗，請點右上方重試';
        document.getElementById('recommend-title').innerText = '讀取異常';
        document.getElementById('recommend-desc').innerText = '請確認網路連線或 API 金鑰限制。';
      }
    }

    // 計算平均車速邏輯
    function processVDData(vdList) {
      let innerSpeeds = [];
      let outerSpeeds = [];

      vdList.forEach(vd => {
        // 篩選雪隧里程 range (15.2k - 28.3k)
        // 判斷方向
        vd.LinkLives?.forEach(link => {
          link.Lanes?.forEach(lane => {
            if (lane.Speed > 0 && lane.Speed < 150) {
              // LaneID 1 為內側, 2 為外側
              if (lane.LaneID == 1) innerSpeeds.push(lane.Speed);
              if (lane.LaneID == 2) outerSpeeds.push(lane.Speed);
            }
          });
        });
      });

      const avgInner = innerSpeeds.length ? (innerSpeeds.reduce((a,b)=>a+b,0)/innerSpeeds.length).toFixed(1) : '--';
      const avgOuter = outerSpeeds.length ? (outerSpeeds.reduce((a,b)=>a+b,0)/outerSpeeds.length).toFixed(1) : '--';

      document.getElementById('speed-inner').innerText = avgInner;
      document.getElementById('speed-outer').innerText = avgOuter;
      document.getElementById('count-inner').innerText = `車道 1 · 偵測點 ${innerSpeeds.length}`;
      document.getElementById('count-outer').innerText = `車道 2 · 偵測點 ${outerSpeeds.length}`;

      document.getElementById('status-text').innerText = '資料連線正常';
      const now = new Date();
      document.getElementById('update-time').innerText = `最後更新 ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}:${now.getSeconds().toString().padStart(2,'0')}`;

      // 建議計算
      if (avgInner !== '--' && avgOuter !== '--') {
        const diff = (avgOuter - avgInner).toFixed(1);
        if (Math.abs(diff) < 2) {
          document.getElementById('recommend-title').innerText = '兩車道車速相近';
          document.getElementById('recommend-desc').innerText = '內外側平均車速差不多，請順暢行駛。';
        } else if (diff > 0) {
          document.getElementById('recommend-title').innerText = `建議走【外側車道】`;
          document.getElementById('recommend-desc').innerText = `外側平均比內側快了 ${diff} km/h`;
        } else {
          document.getElementById('recommend-title').innerText = `建議走【內側車道】`;
          document.getElementById('recommend-desc').innerText = `內側平均比外側快了 ${Math.abs(diff)} km/h`;
        }
      }
    }

    // 首次載入
    fetchData();
  </script>
</body>
</html>
