<script>
(() => {
  'use strict';

  /* ============================================================
   * 0. 使用者設定：請填入你在 TDX 會員中心申請的 API 金鑰
   * ==========================================================*/
  const CLIENT_ID = 'YOUR_CLIENT_ID';
  const CLIENT_SECRET = 'YOUR_CLIENT_SECRET';

  /* ============================================================
   * 1. API 端點與路段參數
   * ==========================================================*/
  const AUTH_URL = 'https://tdx.transportdata.tw/auth/realms/TDX/protocol/openid-connect/token';
  const API_BASE = 'https://tdx.transportdata.tw/api/basic';
  // 國道5號車輛偵測器「靜態」資料：用來取得每個 VDID 對應的方向與里程
  const VD_STATIC_URL = `${API_BASE}/v2/Road/Traffic/VD/Freeway?%24format=JSON`;
  // 國道5號車輛偵測器「即時」資料：車道層級的即時速度
  const VD_LIVE_URL = `${API_BASE}/v2/Road/Traffic/VD/Live/Freeway?%24format=JSON`;

  const ROAD_KEYWORDS = ['國道5號', '國道五號', 'Freeway 5', 'NO05', 'N5'];
  const MILE_START = 15.2;   // 雪山隧道北口（頭城端）約略里程
  const MILE_END = 28.3;     // 雪山隧道南口（蘇澳端）約略里程
  const REFRESH_MS = 60 * 1000; // 每 60 秒自動更新一次
  const STATIC_CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 靜態站點清單快取 6 小時

  /* ============================================================
   * 2. 狀態
   * ==========================================================*/
  let accessToken = null;
  let tokenExpiresAt = 0;
  let vdMetaMap = null;       // VDID -> { direction: 'N'|'S', mile: number }
  let vdMetaFetchedAt = 0;
  let currentDirection = 'N'; // 'N' = 北上(往台北) / 'S' = 南下(往宜蘭)
  let refreshTimer = null;
  let isFetching = false;

  const el = (id) => document.getElementById(id);

  /* ============================================================
   * 3. 取得 Access Token（OAuth2 Client Credentials）
   * ==========================================================*/
  async function getAccessToken() {
    const now = Date.now();
    if (accessToken && now < tokenExpiresAt - 30_000) {
      return accessToken;
    }
    const body = new URLSearchParams({
      grant_type: 'client_credentials',
      client_id: CLIENT_ID,
      client_secret: CLIENT_SECRET,
    });
    const res = await fetch(AUTH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body,
    });
    if (!res.ok) {
      throw new Error(`TDX 授權失敗（HTTP ${res.status}），請確認 CLIENT_ID / CLIENT_SECRET 是否正確`);
    }
    const data = await res.json();
    accessToken = data.access_token;
    tokenExpiresAt = now + (data.expires_in ? data.expires_in * 1000 : 20 * 60 * 1000);
    return accessToken;
  }

  async function tdxFetch(url) {
    const token = await getAccessToken();
    const res = await fetch(url, {
      headers: {
        Authorization: `Bearer ${token}`,
        'Accept-Encoding': 'gzip',
      },
    });
    if (!res.ok) {
      throw new Error(`TDX 資料請求失敗（HTTP ${res.status}）`);
    }
    return res.json();
  }

  /* ============================================================
   * 4. 從 VDID 解析里程（TDX 即時資料不一定直接給里程數，
   *    里程通常會編碼在 VDID 字串中，例如 ".../N5/N/15.200/..."）
   * ==========================================================*/
  function parseMileFromVDID(vdid) {
    if (!vdid) return null;
    // 嘗試找出像 15.200 / 28.3 / 015K200 這類里程格式
    const decimalMatch = vdid.match(/(\d{1,3}\.\d{1,3})/);
    if (decimalMatch) return parseFloat(decimalMatch[1]);
    const kMatch = vdid.match(/0*(\d{1,3})K0*(\d{0,3})/i);
    if (kMatch) {
      const km = parseInt(kMatch[1], 10);
      const m = kMatch[2] ? parseInt(kMatch[2], 10) : 0;
      return km + m / 1000;
    }
    return null;
  }

  function isTargetRoad(item) {
    const name = `${item.RoadName || ''} ${item.RoadID || ''} ${item.VDID || ''}`;
    return ROAD_KEYWORDS.some((kw) => name.includes(kw));
  }

  /* ============================================================
   * 5. 建立 VDID -> { direction, mile } 對照表（靜態資料，快取）
   * ==========================================================*/
  async function getVDMetaMap() {
    const now = Date.now();
    if (vdMetaMap && now - vdMetaFetchedAt < STATIC_CACHE_TTL_MS) {
      return vdMetaMap;
    }
    const list = await tdxFetch(VD_STATIC_URL);
    const map = new Map();
    for (const item of list) {
      if (!isTargetRoad(item)) continue;
      const mile = item.PositionMile ?? item.LocationMile ?? parseMileFromVDID(item.VDID);
      if (mile == null) continue;
      const direction = (item.RoadDirection || item.RoadBearing || '').toUpperCase().startsWith('S') ? 'S' : 'N';
      map.set(item.VDID, { direction, mile });
    }
    vdMetaMap = map;
    vdMetaFetchedAt = now;
    return map;
  }

  /* ============================================================
   * 6. 抓取即時車道速度，依方向與里程篩選雪隧路段，
   *    再依 LaneID 區分內側／外側車道並計算平均速率
   * ==========================================================*/
  async function fetchTunnelLaneSpeeds(direction) {
    const [metaMap, liveList] = await Promise.all([
      getVDMetaMap(),
      tdxFetch(VD_LIVE_URL),
    ]);

    const insideSpeeds = [];   // 內側車道（LaneID 最小者，通常為快車道）
    const outsideSpeeds = [];  // 外側車道（LaneID 最大者，通常為慢車道）
    let insideStations = 0;
    let outsideStations = 0;
    let matchedTime = null;

    for (const vd of liveList) {
      const meta = metaMap.get(vd.VDID);
      if (!meta) continue;
      if (meta.direction !== direction) continue;
      if (meta.mile < MILE_START || meta.mile > MILE_END) continue;

      const lanes = [];
      // TDX VD 即時資料結構：VDLive.LinkFlows[].Lanes[]
      for (const flow of vd.LinkFlows || []) {
        for (const lane of flow.Lanes || []) {
          if (typeof lane.Speed === 'number' && lane.Speed > 0) {
            lanes.push(lane);
          }
        }
      }
      if (lanes.length === 0) continue;

      // 以該偵測器回報的 LaneID 判斷內外側：
      // LaneID 最小 = 最內側（快車道），LaneID 最大 = 最外側（慢車道）
      const minLaneId = Math.min(...lanes.map((l) => l.LaneID));
      const maxLaneId = Math.max(...lanes.map((l) => l.LaneID));

      for (const lane of lanes) {
        if (lane.LaneID === minLaneId) {
          insideSpeeds.push(lane.Speed);
        }
        if (lane.LaneID === maxLaneId) {
          outsideSpeeds.push(lane.Speed);
        }
      }
      insideStations += 1;
      outsideStations += 1;
      if (vd.DataCollectTime) matchedTime = vd.DataCollectTime;
    }

    const avg = (arr) => (arr.length ? Math.round(arr.reduce((a, b) => a + b, 0) / arr.length) : null);

    return {
      inside: avg(insideSpeeds),
      outside: avg(outsideSpeeds),
      insideStations,
      outsideStations,
      dataTime: matchedTime,
    };
  }

  /* ============================================================
   * 7. UI 更新
   * ==========================================================*/
  function setStatus(state, text) {
    const dot = el('statusDot');
    const label = el('statusText');
    label.textContent = text;
    dot.className = 'w-1.5 h-1.5 rounded-full ' + (
      state === 'ok' ? 'bg-[var(--green)]' :
      state === 'loading' ? 'bg-[var(--amber)] pulse-soft' :
      state === 'error' ? 'bg-[var(--red)]' :
      'bg-[var(--ink-dim)]'
    );
  }

  function setSpeedDisplay(id, value) {
    const node = el(id);
    if (value == null) {
      node.textContent = '--';
      node.classList.remove('glow-green', 'glow-red', 'text-[var(--green)]', 'text-[var(--red)]');
      node.classList.add('glow-amber', 'text-[var(--amber)]');
      return;
    }
    node.textContent = value;
    node.classList.remove('glow-amber', 'text-[var(--amber)]', 'glow-green', 'text-[var(--green)]', 'glow-red', 'text-[var(--red)]');
    if (value < 40) {
      node.classList.add('glow-red', 'text-[var(--red)]');
    } else if (value >= 70) {
      node.classList.add('glow-green', 'text-[var(--green)]');
    } else {
      node.classList.add('glow-amber', 'text-[var(--amber)]');
    }
  }

  function renderRecommendation(inside, outside) {
    const icon = el('recoIcon');
    const text = el('recoText');
    const sub = el('recoSub');
    const banner = el('recoBanner');

    banner.classList.remove('border-[var(--green)]/40', 'border-[var(--red)]/40', 'bg-emerald-950/20');

    if (inside == null && outside == null) {
      icon.setAttribute('stroke', 'var(--ink-dim)');
      icon.innerHTML = '<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>';
      text.textContent = '目前雪隧路段暫無偵測資料';
      sub.textContent = '請稍後再試，或確認偵測站設定';
      return;
    }

    if (inside != null && outside != null) {
      const diff = Math.abs(inside - outside);
      if (diff < 3) {
        icon.setAttribute('stroke', 'var(--ink-dim)');
        icon.innerHTML = '<path d="M5 12h14"/>';
        text.textContent = '內外側車速接近，走哪條都差不多';
        sub.textContent = `內側 ${inside} km/h・外側 ${outside} km/h`;
      } else if (outside > inside) {
        icon.setAttribute('stroke', 'var(--green)');
        icon.innerHTML = '<path d="M5 12h9M9 7l5 5-5 5"/>';
        text.innerHTML = `建議走<span class="text-[var(--green)]">外側</span>，快 ${diff} km/h`;
        sub.textContent = `內側 ${inside} km/h・外側 ${outside} km/h`;
      } else {
        icon.setAttribute('stroke', 'var(--green)');
        icon.innerHTML = '<path d="M5 12h9M9 7l5 5-5 5"/>';
        text.innerHTML = `建議走<span class="text-[var(--green)]">內側</span>，快 ${diff} km/h`;
        sub.textContent = `內側 ${inside} km/h・外側 ${outside} km/h`;
      }
    } else {
      const known = inside != null ? '內側' : '外側';
      const val = inside != null ? inside : outside;
      icon.setAttribute('stroke', 'var(--amber)');
      icon.innerHTML = '<path d="M12 9v4M12 17h.01"/><circle cx="12" cy="12" r="9"/>';
      text.textContent = `僅取得${known}車道資料（${val} km/h）`;
      sub.textContent = '另一車道暫無回報';
    }
  }

  function showError(message) {
    const box = el('errorBox');
    box.textContent = message;
    box.classList.remove('hidden');
  }
  function clearError() {
    el('errorBox').classList.add('hidden');
  }

  function updateDirectionButtons() {
    document.querySelectorAll('.dir-btn').forEach((btn) => {
      const active = btn.dataset.dir === currentDirection;
      btn.classList.toggle('bg-[var(--amber)]', active);
      btn.classList.toggle('text-black', active);
      btn.classList.toggle('text-[var(--ink-dim)]', !active);
    });
  }

  function formatClock(date) {
    return date.toLocaleTimeString('zh-TW', { hour12: false });
  }

  /* ============================================================
   * 8. 主要更新流程
   * ==========================================================*/
  async function refresh() {
    if (isFetching) return;
    isFetching = true;
    el('refreshIcon').classList.add('animate-spin');
    setStatus('loading', '正在更新雪隧車速…');
    clearError();

    if (CLIENT_ID === 'YOUR_CLIENT_ID' || CLIENT_SECRET === 'YOUR_CLIENT_SECRET') {
      setStatus('error', '尚未設定 API 金鑰');
      showError('請先在程式碼最上方填入你的 TDX CLIENT_ID 與 CLIENT_SECRET（可於 tdx.transportdata.tw 會員中心申請）。');
      setSpeedDisplay('insideSpeed', null);
      setSpeedDisplay('outsideSpeed', null);
      renderRecommendation(null, null);
      isFetching = false;
      el('refreshIcon').classList.remove('animate-spin');
      return;
    }

    try {
      const result = await fetchTunnelLaneSpeeds(currentDirection);
      setSpeedDisplay('insideSpeed', result.inside);
      setSpeedDisplay('outsideSpeed', result.outside);
      el('insideMeta').textContent = `車道 1・偵測站 ${result.insideStations}`;
      el('outsideMeta').textContent = `車道 2・偵測站 ${result.outsideStations}`;
      renderRecommendation(result.inside, result.outside);

      const now = new Date();
      el('lastUpdated').textContent = `最後更新 ${formatClock(now)}`;
      setStatus('ok', result.dataTime ? `資料時間 ${result.dataTime.slice(11, 19)}` : '已更新');
    } catch (err) {
      console.error(err);
      setStatus('error', '更新失敗');
      showError(err.message || '無法連線至 TDX，請檢查網路連線或 API 金鑰是否有效。');
    } finally {
      isFetching = false;
      el('refreshIcon').classList.remove('animate-spin');
    }
  }

  function scheduleAutoRefresh() {
    if (refreshTimer) clearInterval(refreshTimer);
    refreshTimer = setInterval(refresh, REFRESH_MS);
  }

  /* ============================================================
   * 9. 事件綁定
   * ==========================================================*/
  document.querySelectorAll('.dir-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      if (btn.dataset.dir === currentDirection) return;
      currentDirection = btn.dataset.dir;
      updateDirectionButtons();
      refresh();
    });
  });

  el('refreshBtn').addEventListener('click', refresh);

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refresh();
  });

  /* ============================================================
   * 10. 啟動：初始化畫面 + 註冊 Service Worker（離線快取外殼）
   * ==========================================================*/
  updateDirectionButtons();
  refresh();
  scheduleAutoRefresh();

  if ('serviceWorker' in navigator) {
    const swSource = `
      const CACHE = 'xueshan-vd-shell-v1';
      self.addEventListener('install', (e) => {
        self.skipWaiting();
        e.waitUntil(caches.open(CACHE).then((c) => c.add(self.registration.scope)));
      });
      self.addEventListener('activate', (e) => { self.clients.claim(); });
      self.addEventListener('fetch', (e) => {
        if (e.request.method !== 'GET') return;
        const url = new URL(e.request.url);
        // 只快取 App 外殼本身，TDX API 一律走網路以確保資料即時
        if (url.origin !== self.location.origin) return;
        e.respondWith(
          caches.match(e.request).then((cached) => cached || fetch(e.request).catch(() => cached))
        );
      });
    `;
    try {
      const blob = new Blob([swSource], { type: 'application/javascript' });
      const swUrl = URL.createObjectURL(blob);
      navigator.serviceWorker.register(swUrl).catch(() => {});
    } catch (e) { /* Service Worker 註冊非必要功能，失敗時忽略 */ }
  }
})();
</script>
</body>
</html>
